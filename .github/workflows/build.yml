name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device (directory under devices/), or all"
        type: choice
        default: "all"
        options:
          - all
          - cm520-79f
      version:
        description: "ImmortalWrt release"
        type: choice
        default: "25.12.2"
        options:
          - "25.12.2"
          - "24.10.6"
      release:
        description: "Publish to GitHub Releases (otherwise upload a workflow artifact)"
        type: boolean
        default: true

jobs:
  devices:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve device list
        id: list
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          if [[ "${DEVICE}" == "all" ]]; then
            list="$(printf '%s\n' devices/*/device.conf | cut -d/ -f2 | jq -Rnc '[inputs]')"
          else
            [[ -f "devices/${DEVICE}/device.conf" ]] || { echo "Unknown device: ${DEVICE}"; exit 1; }
            list="$(jq -nc --arg d "${DEVICE}" '[$d]')"
          fi
          echo "list=${list}" >> "${GITHUB_OUTPUT}"

  build:
    needs: devices
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.list) }}
    env:
      WIFI_KEY: ${{ secrets.WIFI_KEY }}
      WIFI_COUNTRY: ${{ vars.WIFI_COUNTRY }}

    steps:
      - uses: actions/checkout@v6

      - name: Read device target
        id: target
        run: |
          source "devices/${{ matrix.device }}/device.conf"
          echo "slug=${TARGET//\//-}" >> "${GITHUB_OUTPUT}"

      - name: Install ImageBuilder dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential file gawk gettext libncurses-dev \
            python3 rsync unzip wget zstd xsltproc

      - name: Cache ImageBuilder archive
        uses: actions/cache@v4
        with:
          path: work/dl/*.tar.zst
          key: imagebuilder-${{ steps.target.outputs.slug }}-${{ inputs.version }}

      - name: Build
        run: ./build.sh "${{ matrix.device }}" "${{ inputs.version }}"

      - name: Stage release files
        id: stage
        env:
          DEVICE: ${{ matrix.device }}
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          dir="release/${DEVICE}"
          mkdir -p "${dir}"
          files=(output/"${DEVICE}"/*.{bin,ubi,itb,manifest} output/"${DEVICE}"/*.img.gz)
          (( ${#files[@]} > 0 )) || { echo "No firmware files in output/${DEVICE}"; exit 1; }
          cp "${files[@]}" "${dir}/"
          (cd "${dir}" && sha256sum -b -- * > sha256sums)
          ./release-notes.sh "${DEVICE}" "${dir}" > "release/${DEVICE}.md"
          month="$(date -u +%Y.%m)"
          model="$(jq -r '.profiles[].titles[0] | [.vendor, .model] | map(select(. != null)) | join(" ")' "output/${DEVICE}/profiles.json")"
          {
            echo "dir=${dir}"
            echo "tag=ImmortalWrt_${DEVICE}_${VERSION}_${month}"
            echo "name=${model} · ImmortalWrt ${VERSION} · ${month}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload to Release
        if: ${{ inputs.release }}
        uses: ophub/upload-to-releases@main
        with:
          tag: ${{ steps.stage.outputs.tag }}
          name: ${{ steps.stage.outputs.name }}
          artifacts: ${{ steps.stage.outputs.dir }}/*
          body_file: release/${{ matrix.device }}.md
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ inputs.version }}-${{ matrix.device }}
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
