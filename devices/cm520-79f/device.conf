# Sourced by build.sh. Values come from the release's targets/<TARGET>/profiles.json.
TARGET="ipq40xx/generic"
PROFILE="mobipromo_cm520-79f"

# y: bake SSID 'MyWRT' + WPA2/WPA3 (WIFI_KEY, WIFI_COUNTRY) into board.d wireless defaults.
WIFI_DEFAULTS="y"
# Overrides the global WIFI_COUNTRY.
WIFI_COUNTRY="AU"
# First-boot radio settings; 2.4 GHz has no 802.11ac, so it stays 802.11n.
WIFI_CHANNEL_2G="6"
WIFI_HTMODE_2G="HT20"
WIFI_CHANNEL_5G="149"
WIFI_HTMODE_5G="VHT80"
